name: CI

# Corre en cada PR hacia las ramas de entorno y en cada push a ellas (después del merge).
on:
  push:
    branches: [dev, staging, production]
  pull_request:
    branches: [dev, staging, production]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    name: Format + Analyze + Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build-apk:
    name: Build APK (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: analyze-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # Debug porque todavía no hay keystore de firma. El release firmado llega con el
      # pipeline de distribución (Managed Google Play), con el keystore como secreto del repo.
      - name: Build
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: logistics-app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
