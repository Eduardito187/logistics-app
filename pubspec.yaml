name: logistics_app
description: "DisTrack — app logística interna de Dismac: andén, carga, escaneo, GPS de flota y entrega"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.8.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # Localización en español (America/La_Paz): date pickers y formatos de Material.
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.2
  go_router: ^17.0.0
  dio: ^5.11.1
  flutter_secure_storage: ^10.3.4
  cryptography: ^2.9.0

  # Cliente API generado desde openapi/v1.yaml (ver swagger_parser abajo).
  json_annotation: ^4.9.0
  retrofit: ^4.10.0

  # Offline-first: base local + cola de eventos idempotente.
  drift: ^2.21.0
  drift_flutter: ^0.2.4
  path_provider: ^2.1.5
  path: ^1.9.0

  # Identificadores idempotentes ordenables (ULID) para escaneos offline.
  ulid: ^2.0.1

  # Escaneo de EAN/QR con la cámara (preparador, chofer, tienda, transportista).
  # Fijado EXACTO en 7.2.0: iOS ya usa Apple Vision (sin ML Kit → sin choque de
  # GoogleDataTransport con Firebase) y en Android usa CameraX 1.5.3, que compila
  # con AGP 8.7.3. OJO: 7.2.1 y 7.3+ suben a CameraX 1.6.1, que exige AGP 8.9.1
  # (> el tope de Flutter 3.32) y rompe el build. NO cambiar sin subir Flutter/AGP.
  mobile_scanner: 7.2.0

  # Mapas OSM self-host (ADR 013, sin Google) y geometría de ruta.
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # GPS en vivo del camión (telemetría + POD georreferenciado).
  geolocator: ^13.0.2

  # Impresión de etiquetas ZPL: Bluetooth (flutter_blue_plus), WiFi (socket
  # dart:io, sin dep) y USB (usb_serial).
  flutter_blue_plus: ^1.34.5
  usb_serial: ^0.5.2

  # Fotos de POD / daños / checklist.
  image_picker: ^1.1.2
  permission_handler: ^11.3.1

  # Estado de red para el sync offline-first.
  connectivity_plus: ^6.1.0

  # Formato de fechas/números en español (America/La_Paz).
  intl: ^0.20.2
  collection: ^1.19.0

  # Push por Firebase Cloud Messaging (FCM). Firebase se inicializa con las
  # credenciales de config/*.json (FIREBASE_*), sin google-services.json. Las
  # notificaciones locales muestran los avisos con la app en primer plano.
  firebase_core: ^5.0.0
  firebase_messaging: ^17.0.0
  flutter_local_notifications: ^18.0.1

  # Mapas: clustering de marcadores y navegación externa a apps de mapas.
  flutter_map_marker_cluster: ^1.4.0
  url_launcher: ^6.3.1

  # GPS en segundo plano mientras el chofer rueda (foreground service).
  flutter_foreground_task: ^8.17.0

  # Versión de la app para el control de compatibilidad con el backend.
  package_info_plus: ^9.0.1

  # Fase de cierre (2026-10-16):
  # - Reporte de crashes/errores en terreno (mismo proyecto Firebase que el push).
  firebase_crashlytics: ^6.0.0
  # - Subir la cola offline en segundo plano aunque la app esté cerrada.
  workmanager: '>=0.5.2 <0.10.0'
  # - Tiles del mapa guardados en el teléfono (zonas sin señal).
  flutter_map_cache: ^2.0.0
  dio_cache_interceptor: ^4.0.0
  http_cache_file_store: ^2.0.0
  # - Firma del cliente en pantalla para la prueba de entrega.
  signature: ^6.0.0

  # Marca DisTrack: logo/isotipo vectorial (SVG) y splash animado (Lottie).
  flutter_svg: ^2.0.17
  lottie: ^3.1.3

  # QR del 2FA generado EN EL CLIENTE desde la URI otpauth:// (el backend no da
  # imagen). Solo dibuja el QR; no lee cámara. Requiere `flutter pub get`.
  qr_flutter: ^4.1.0

dependency_overrides:
  # workmanager 0.9.2: workmanager_android 0.9.3 arrastra platform_interface
  # 0.9.4 (agrega foregroundServiceConfig) que workmanager_apple 0.9.4 no
  # implementa → no compila. 0.9.3/0.9.2 son compatibles y piden Flutter 3.32.
  # Sacar cuando el proyecto pueda usar workmanager 0.10.x (Flutter >= 3.38).
  workmanager_platform_interface: 0.9.3
  workmanager_android: 0.9.2
  # usb_serial 0.5.2 (última en pub.dev) usa jcenter() y no compila con Gradle 9 /
  # AGP 9. Copia parcheada en third_party/ (ver su android/build.gradle).
  usb_serial:
    path: third_party/usb_serial

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Pruebas de los flujos críticos en dispositivo/emulador.
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Generación de código: cliente API (swagger_parser) y base local (drift).
  build_runner: ^2.4.13
  drift_dev: ^2.21.0
  json_serializable: ^6.11.2
  retrofit_generator: ^10.2.0
  swagger_parser: ^1.21.3

  # Generadores de marca DisTrack: íconos de app y splash nativo.
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Assets de marca DisTrack (logos/isotipo SVG, splash Lottie, PNG fuente).
  assets:
    - assets/brand/
    - assets/brand/png/

  # Tipografías de marca (OFL): Barlow (texto/botones/wordmark),
  # Barlow Condensed (títulos), IBM Plex Mono (códigos y referencias).
  fonts:
    - family: Barlow
      fonts:
        - asset: assets/fonts/Barlow-Regular.ttf
        - asset: assets/fonts/Barlow-Medium.ttf
          weight: 500
        - asset: assets/fonts/Barlow-Bold.ttf
          weight: 700
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
        - asset: assets/fonts/BarlowCondensed-ExtraBold.ttf
          weight: 800
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500

# Íconos de app DisTrack. Generar con: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/brand/png/app-icon-1024.png"
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 24
  adaptive_icon_background: "#141414"
  adaptive_icon_foreground: "assets/brand/png/app-icon-1024.png"

# Splash nativo DisTrack (fondo Noche + isotipo). Generar con:
# dart run flutter_native_splash:create
flutter_native_splash:
  color: "#141414"
  image: "assets/brand/png/app-icon-512.png"
  android_12:
    color: "#141414"
    image: "assets/brand/png/app-icon-512.png"
  android: true
  ios: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
