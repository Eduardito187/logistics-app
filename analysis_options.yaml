include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    # Plugin de terceros vendorizado (usb_serial parcheado para Gradle 9).
    - third_party/**
    # Cliente API generado desde openapi/v1.yaml (regla #5): no se edita a mano.
    - lib/core/api/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - ios/**
    - linux/**
  language:
    strict-casts: true
    strict-raw-types: true

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - unawaited_futures
