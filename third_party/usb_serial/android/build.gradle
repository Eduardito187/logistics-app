// Copia parcheada de usb_serial 0.5.2 (pub.dev): el original usa jcenter() y
// AGP 4.1 en buildscript, incompatibles con Gradle 9 / AGP 9 de esta app.
// Cambios: sin buildscript ni jcenter(), lint {} en vez de lintOptions, SDK/Java al día.
group 'dev.bessems.usbserial'
version '1.0'

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'dev.bessems.usbserial'
    compileSdk 36

    defaultConfig {
        minSdk 21
    }
    lint {
        disable 'InvalidPackage'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.github.felHR85:UsbSerial:6.1.0'
}
