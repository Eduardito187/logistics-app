# Heap acotado: 8G/4G colgaba WSL (saturaba toda la RAM del equipo). 2G de heap
# alcanza de sobra para builds Flutter/Android; metaspace 1G; workers limitados.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=3
org.gradle.parallel=true
# Sin daemon de Gradle ni de Kotlin: en WSL con poca RAM quedaban ~2GB vivos tras
# cada build. El daemon solo acelera builds seguidas; el hot reload no usa Gradle.
org.gradle.daemon=false
kotlin.compiler.execution.strategy=in-process
# Build cache OFF: en el FS de WSL falla al empacar entradas ("Could not get file
# mode"), lo que marca las tareas como fallidas aunque hayan compilado bien.
org.gradle.caching=false
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
