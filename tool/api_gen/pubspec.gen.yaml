# Pubspec MÍNIMO para GENERAR el cliente del API (lib/core/api/).
#
# No es parte de la app: lo usan scripts/regen_api_client.ps1 / .sh, que copian este
# archivo (y su pubspec.lock) a una carpeta temporal y corren ahí swagger_parser +
# build_runner con el Flutter 3.47 / Dart 3.13 de C:\sdk\flutter.
#
# Por qué existe: la app está fijada a Flutter 3.32 / Dart 3.8 (C:\flutter) y
# retrofit_generator >= 10.2.6 exige Dart 3.9 (las versiones que corren en 3.8 no
# conocen Parser.DartMappable). El código generado SÍ compila en Dart 3.8.
#
# Versiones: las mismas que generaron el cliente actual (pubspec.lock de esta carpeta).
# Si se suben, regenerar con -DryRun y revisar el diff antes de aplicarlo.
name: logistics_api_gen
description: Generador del cliente API de logistics-app (no se publica).
publish_to: none

environment:
  sdk: ^3.13.5

dependencies:
  dio: ^5.11.1
  json_annotation: ^4.12.0
  retrofit: ^4.10.0

dev_dependencies:
  build_runner: ^2.15.1
  json_serializable: ^6.14.1
  retrofit_generator: ^10.2.12
  swagger_parser: ^1.45.0
